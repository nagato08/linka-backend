services:
  postgres:
    build: ./docker/postgres
    container_name: linka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linka
      POSTGRES_PASSWORD: linka
      POSTGRES_DB: linka
    ports:
      - '5435:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U linka -d linka']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: linka-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6381:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Stockage des médias en local, compatible S3.
  minio:
    image: minio/minio:latest
    container_name: linka-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: linka
      MINIO_ROOT_PASSWORD: linka-secret
    ports:
      - '9002:9000'
      - '9003:9001'
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
