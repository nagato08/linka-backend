# =============================================================================
# Déploiement de production
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Les secrets viennent d'un fichier .env.production non versionné.
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linka-api
    restart: unless-stopped
    env_file: .env.production
    ports:
      # Écoute uniquement en local : Caddy ou Nginx assure le TLS devant.
      # Exposer 3000 publiquement contournerait le pare-feu applicatif.
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Les migrations sont jouées avant le démarrage : un conteneur qui monte
    # sur un schéma périmé échoue de façon obscure, souvent en pleine requête.
    command: >
      sh -c "npx prisma migrate deploy && node dist/main.js"
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  postgres:
    build: ./docker/postgres
    container_name: linka-postgres
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Aucun port publié : seuls les conteneurs du réseau y accèdent.
    # Une base de données joignable depuis Internet est balayée en heures.

  redis:
    image: redis:7-alpine
    container_name: linka-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
